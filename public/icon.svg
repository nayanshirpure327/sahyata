<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B132B"/>
      <stop offset="100%" stopColor="#090D16"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="50%" stopColor="#2563EB"/>
      <stop offset="100%" stopColor="#F59E0B"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="50%" stopColor="#2563EB"/>
      <stop offset="100%" stopColor="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- S Loop Part 1 -->
  <path d="M 30 24 C 20 24, 14 36, 22 48 C 28 56, 44 60, 56 66 C 70 72, 78 80, 72 88 C 65 96, 46 96, 36 86" 
        stroke="url(#sGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- S Loop Part 2 -->
  <path d="M 70 76 C 80 76, 86 64, 78 52 C 72 44, 56 40, 44 34 C 30 28, 22 20, 28 12 C 35 4, 54 4, 64 14" 
        stroke="url(#sGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Spark Node -->
  <circle cx="50" cy="50" r="5" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="3" fill="url(#accentGrad)"/>

  <!-- Guiding Star Sparkle -->
  <polygon points="78,16 81,24 89,27 81,30 78,38 75,30 67,27 75,24" fill="url(#accentGrad)"/>
</svg>
